<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="claude:viewport-fit-sides" content="cover">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Inter:wght@400;500;600&family=Cormorant+Garamond:ital,wght@1,600&family=Fjalla+One&display=swap">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0}img{max-width:100%}</style>
<style>
/* Hyphen Management roster tour book. Brand: ink #00020A, navy #1B266B, cream #E0D9C5, lime #E0F666; Archivo (expanded) + Inter. */
:root{
  --bg:#EEE9DD; --surface:#E0D9C5; --raised:#F8F5EE; --ink:#00020A; --muted:#5E5B55; --line:rgba(0,2,10,.13);
  --sky:#E0F666; --deep:#1B266B; --red:#1B266B; --gum:#E0F666; --field:#B9AF92; --onred:#F3F0E6; --lime:#E0F666; --navy:#1B266B;
  --show:#1B266B; --reh:#6E7BC4; --trav:#A39A7E; --other:#9DB52A;
  --display:"Archivo", "Helvetica Neue", Arial, sans-serif;
  --sans:Inter, -apple-system, "Helvetica Neue", Arial, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#05070F; --surface:#121733; --raised:#1A2046; --ink:#EEE9DD; --muted:#A8A493; --line:rgba(238,233,221,.14);
  --sky:#E0F666; --deep:#C7CFFF; --red:#E0F666; --gum:#E0F666; --field:#B9AF92; --onred:#00020A;
  --show:#E0F666; --reh:#9AA6EE; --trav:#B9AF92; --other:#C7CFFF; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#05070F; --surface:#121733; --raised:#1A2046; --ink:#EEE9DD; --muted:#A8A493; --line:rgba(238,233,221,.14);
  --sky:#E0F666; --deep:#C7CFFF; --red:#E0F666; --gum:#E0F666; --field:#B9AF92; --onred:#00020A;
  --show:#E0F666; --reh:#9AA6EE; --trav:#B9AF92; --other:#C7CFFF; color-scheme:dark; }
</style>
<style>
/* Layout: phone-first tour book. Sticky brand bar, month grid, day sheet below (side by side on wide screens). */
/*TOKENS*/
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit}
a{color:var(--deep)}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px;border-radius:6px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar-in{max-width:1080px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:500}
.brandtxt{display:flex;flex-direction:column;gap:2px;margin-right:auto}
.seg{display:flex;background:var(--surface);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:999px;font-size:13px;font-weight:500;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--ink);box-shadow:0 1px 2px rgba(0,2,10,.12)}

main{max-width:1080px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.cal-layout{display:grid;gap:20px}
@media (min-width:860px){ .cal-layout{grid-template-columns:minmax(0,380px) minmax(0,1fr);align-items:start} .calcol{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)} }

/* month grid */
.month-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.month-title{font-family:var(--display);font-size:28px;font-weight:500;letter-spacing:.01em}
.nav{display:flex;gap:4px}
.nav button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:18px;line-height:1}
.nav button:hover{background:var(--surface)}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.dow{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:center;padding:4px 0 6px}
.cell{aspect-ratio:1/1.05;border:0;background:transparent;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:7px;gap:4px;cursor:pointer;font-variant-numeric:tabular-nums;position:relative}
.cell .n{font-size:15px;width:30px;height:30px;display:grid;place-items:center;border-radius:50%}
.cell.out{opacity:.32}
.cell:hover{background:var(--surface)}
.cell.today .n{border:1.5px solid var(--red);font-weight:600}
.cell.sel{background:var(--surface)}
.cell.sel .n{background:var(--ink);color:var(--bg);border-color:transparent;font-weight:600}
.cell.past .n{color:var(--muted)}
.dot{width:6px;height:6px;border-radius:50%}
.t-show{background:var(--show)} .t-rehearsal{background:var(--reh)} .t-travel{background:var(--trav)} .t-other{background:var(--other)}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.upnext{margin-top:18px;padding:14px;border-radius:14px;background:var(--surface);display:flex;flex-direction:column;gap:2px;cursor:pointer;border:0;text-align:left;width:100%}
.upnext b{font-family:var(--display);font-size:20px;font-weight:600}
.files-all{margin-top:14px}

/* day sheet */
.sheet{display:flex;flex-direction:column;gap:14px;min-width:0}
.dhead{padding:20px;border-radius:18px;background:var(--sky);color:#00020A}
.dhead.type-show.upcoming{background:var(--sky)}
.dhead.past{background:var(--surface);color:var(--ink)}
.dhead.type-rehearsal{background:#1B266B;color:#F3F0E6}
.dhead.type-travel,.dhead.type-other{background:var(--gum);color:#00020A}
.dhead .eyebrow{color:inherit;opacity:.78}
.ddate{font-family:var(--display);font-size:19px;margin-top:6px}
.dvenue{font-family:var(--display);font-size:38px;line-height:1.02;font-weight:600;margin:4px 0 4px;text-wrap:balance}
.dcity{font-size:15px;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{font-size:11.5px;font-weight:500;padding:4px 10px;border-radius:999px;background:rgba(243,240,230,.55);color:#00020A}
.chip.status-Confirmed,.chip.status-Locked{background:#00020A;color:#F3F0E6}
.chip.status-Accepted{background:#F3F0E6;color:#00020A}
.chip.status-Played{background:rgba(0,2,10,.08);color:inherit}
.dhead.past .chip{background:var(--bg);color:var(--ink)}
.dhead.type-rehearsal .chip{background:rgba(243,240,230,.18);color:#F3F0E6}

.card{background:var(--raised);border:1px solid var(--line);border-radius:16px;padding:16px}
.card h3{margin:0 0 10px;font-family:var(--display);font-size:22px;font-weight:600;display:flex;align-items:baseline;gap:8px}
.card h3 small{font-family:var(--sans);font-style:normal;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-left:auto}
.twocol{display:grid;gap:14px}
@media (min-width:620px){ .twocol{grid-template-columns:minmax(0,1fr) minmax(0,1fr)} }

.sched{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.sched li{display:grid;grid-template-columns:92px 14px minmax(0,1fr);gap:10px;align-items:start;padding:7px 0;border-bottom:1px dashed var(--line)}
.sched li:last-child{border-bottom:0}
.sched .tm{font-variant-numeric:tabular-nums;font-weight:600;font-size:14px}
.sched .tm.tba{color:var(--muted);font-weight:500;}
.sched .pip{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--muted);margin-top:5px}
.sched li.mine .pip{background:var(--red);border-color:var(--red)}
.sched li.mine .lb{font-weight:600}
.sched .end{color:var(--muted);font-size:12.5px;display:block}
.note{font-size:12.5px;color:var(--muted);margin-top:8px}

.people{display:flex;flex-direction:column;gap:8px}
.person{display:flex;align-items:center;gap:10px}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:16px;background:var(--surface);flex:none}
.av.artist{background:var(--red);color:var(--onred)}
.person .nm{font-weight:500}
.person .rl{font-size:12.5px;color:var(--muted)}
.person.maybe{opacity:.62}
.person .ph{margin-left:auto;font-size:12.5px;font-variant-numeric:tabular-nums;user-select:all;color:var(--muted)}

.docs{display:flex;flex-direction:column;gap:8px}
.doc{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--surface);text-decoration:none;color:var(--ink)}
.doc:hover{outline:1px solid var(--line)}
.pdf{flex:none;width:34px;height:42px;border-radius:5px;background:var(--bg);border:1px solid var(--line);display:grid;place-items:end center;padding-bottom:5px;font-size:8.5px;font-weight:600;letter-spacing:.08em;color:var(--red);position:relative}
.pdf::before{content:"";position:absolute;top:-1px;right:-1px;width:10px;height:10px;background:var(--surface);border-bottom-left-radius:4px;border-left:1px solid var(--line);border-bottom:1px solid var(--line)}
.doc .dt{font-weight:500;font-size:14px}
.doc .ds{font-size:12px;color:var(--muted)}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:12.5px;color:var(--muted)}

.kv{display:flex;flex-direction:column;gap:10px;margin:0}
.kv div{display:grid;grid-template-columns:92px minmax(0,1fr);gap:10px}
.kv dt{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding-top:2px;font-weight:500}
.kv dd{margin:0;font-size:14px;min-width:0;overflow-wrap:anywhere}
.contact{padding:9px 0;border-bottom:1px solid var(--line)}
.contact:last-child{border-bottom:0}
.contact .nm{font-weight:600}
.contact .rl{font-size:12.5px;color:var(--muted)}
.contact .ln{font-size:13px;font-variant-numeric:tabular-nums;display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:3px;overflow-wrap:anywhere}
.contact .ln span{user-select:all}
.advance{background:var(--surface);border:0}
.advance .owed{font-size:13px;margin-top:6px}
.empty{color:var(--muted);font-size:13.5px}

/* list view */
.list{display:flex;flex-direction:column;gap:26px;max-width:760px}
.list h2{font-family:var(--display);font-weight:500;font-size:26px;margin:0 0 6px}
.row{display:grid;grid-template-columns:52px 10px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.row:hover{background:var(--surface)}
.row .d{display:flex;flex-direction:column;align-items:center;line-height:1}
.row .d b{font-family:var(--display);font-size:26px;font-weight:600;font-variant-numeric:lining-nums tabular-nums}
.row .d span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.row .v{font-weight:600;font-size:15px}
.row .c{font-size:13px;color:var(--muted)}
.row .s{font-size:11px;color:var(--muted);text-align:right;letter-spacing:.04em}
.listtools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toggle{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.foot{max-width:1080px;margin:0 auto;padding-block:0 30px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-size:11.5px;color:var(--muted);letter-spacing:.04em}
@media (prefers-reduced-motion:no-preference){ .sheet{animation:rise .25s ease-out} @keyframes rise{from{transform:translateY(6px)}to{transform:none}} }

.list{max-width:760px;margin:0 auto}
.detail{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.back{align-self:flex-start;border:0;background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:500;cursor:pointer}
.nextup{border:0;text-align:left;width:100%;cursor:pointer;background:var(--sky);color:#00020A;border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:3px}
.nextup .eyebrow{color:inherit;opacity:.78}
.nextup .nv{font-family:var(--display);font-size:34px;font-weight:600;line-height:1.05;margin-top:4px}
.nextup .nc{font-size:14.5px;font-weight:500}
.nextup .go{margin-top:10px;font-size:13px;font-weight:600}
a.toggle{color:var(--ink);text-decoration:none}
.row.was{opacity:.6}
.nx{background:var(--red);color:var(--onred);padding:3px 8px;border-radius:999px;font-weight:600;letter-spacing:.04em}
.list .legend{margin-top:0}

/* photos */
.hero{position:relative;border-radius:22px;overflow:hidden;aspect-ratio:4/5;max-height:68vh;width:100%;max-width:100%;background:#00020A;isolation:isolate}
@media (min-width:700px){ .hero{aspect-ratio:16/8} }
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 22%;transform-origin:50% 40%}
.hero-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,2,10,0) 40%,rgba(0,2,10,.55) 72%,rgba(0,2,10,.9) 100%)}
.hero-txt{position:absolute;left:20px;right:20px;bottom:56px;display:flex;flex-direction:column;gap:6px}
.logo-big{width:min(300px,72%);background:#F3F0E6}
.hero-txt .eyebrow{color:#E0D9C5;opacity:.9}
.nextup{position:relative;margin-top:-38px;z-index:2;width:calc(100% - 24px);margin-left:12px;box-shadow:0 12px 30px -12px rgba(0,2,10,.45)}
.list{display:flex;flex-direction:column;gap:22px}
.dhead.photo{position:relative;overflow:hidden;min-height:300px;display:flex;flex-direction:column;justify-content:flex-end;color:#F3F0E6;background:#00020A;isolation:isolate}
.dhead.photo::before{content:"";position:absolute;inset:0;z-index:-2;background:var(--ph) center 30%/cover no-repeat}
.dhead.photo::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,2,10,.15) 0%,rgba(0,2,10,.55) 45%,rgba(0,2,10,.92) 100%)}
.dhead.photo .chip{background:rgba(243,240,230,.18);color:#F3F0E6;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.dhead.photo .chip.status-Confirmed,.dhead.photo .chip.status-Locked{background:#1B266B;color:#F3F0E6}
.dhead.photo .chip.status-Accepted{background:#F3F0E6;color:#00020A}
.dhead.photo .dvenue{font-size:44px}
.row:active,.nextup:active,.doc:active,.back:active{transform:scale(.98)}
.row,.nextup,.doc,.back{transition:transform .15s ease, background-color .2s ease}
@media (prefers-reduced-motion:no-preference){
  .hero img{animation:kb 22s ease-in-out infinite alternate}
  @keyframes kb{from{transform:scale(1)}to{transform:scale(1.09) translate(-1.5%,1%)}}
  .hero-txt{animation:up .9s .15s cubic-bezier(.2,.7,.2,1) both}
  .nextup{animation:up .7s .3s cubic-bezier(.2,.7,.2,1) both}
  .row{animation:up .5s calc(.35s + var(--i,0) * 45ms) cubic-bezier(.2,.7,.2,1) both}
  @keyframes up{from{opacity:.0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .detail{animation:slide .38s cubic-bezier(.2,.7,.2,1) both}
  @keyframes slide{from{opacity:.4;transform:translateX(28px)}to{opacity:1;transform:none}}
  .dhead.photo::before{animation:kb2 1.4s cubic-bezier(.2,.7,.2,1) both}
  @keyframes kb2{from{transform:scale(1.12)}to{transform:scale(1)}}
  .detail .card{animation:up .5s cubic-bezier(.2,.7,.2,1) both}
  .detail .twocol:nth-of-type(1) .card{animation-delay:.12s}
  .detail .twocol:nth-of-type(2) .card{animation-delay:.2s}
  .nx{animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(27,38,107,.45)}50%{box-shadow:0 0 0 6px rgba(27,38,107,0)}}
}

.pdfv{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.pdfbar{display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.pdft{flex:1;min-width:0;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zoom{display:flex;gap:4px}
.zoom button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--raised);font-size:18px;cursor:pointer}
.pdfpages{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:12px 12px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:12px;background:var(--surface)}
.pdfpages canvas{background:#fff;border-radius:6px;box-shadow:0 6px 20px -10px rgba(0,2,10,.4);flex:none}
.pdfmsg{margin:40px auto;color:var(--muted);font-size:14px;text-align:center;max-width:280px}
@media (prefers-reduced-motion:no-preference){ .pdfv:not([hidden]){animation:sheetup .3s cubic-bezier(.2,.7,.2,1)} @keyframes sheetup{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}} }

.glform{display:flex;flex-direction:column;gap:8px;margin:6px 0 12px}
.glform input,.glform select,.gl-q{font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-width:0}
.glrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.glrow select{flex:1}
.gl-plus{display:flex;align-items:center;gap:6px;font-size:14px}
.glform button{font:inherit;font-weight:600;padding:10px 16px;border-radius:10px;border:0;background:var(--red);color:var(--onred);cursor:pointer}
.glform button:disabled{opacity:.6}
.gl-q{width:100%;margin-bottom:10px}
.gllist{display:flex;flex-direction:column;gap:6px}
.glgroup summary{cursor:pointer;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 0;list-style:none;display:flex;justify-content:space-between}
.glgroup summary::-webkit-details-marker{display:none}
.glgroup summary::after{content:"▾";margin-left:8px}
.glgroup:not([open]) summary::after{content:"▸"}
.glgroup summary span{margin-left:auto;font-variant-numeric:tabular-nums}
.glitem{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.gli-main{flex:1;min-width:0}
.glitem .nm{font-weight:500;font-size:14px}
.glitem .rl{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.plus{font-size:11px;font-weight:600;color:var(--deep)}
.st{font:inherit;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;border:0;background:var(--surface);color:var(--ink);white-space:nowrap}
button.st{cursor:pointer}
.st-Approved{background:#1B266B;color:#F3F0E6}
.st-RSVPyes{background:var(--sky);color:#00020A}
.st-Requested{background:var(--gum);color:#00020A}
.glx{font:inherit;border:0;background:transparent;color:var(--muted);font-size:18px;line-height:1;padding:4px 6px;cursor:pointer;border-radius:8px}
.glx.sure{font-size:12px;font-weight:600;color:var(--red);background:var(--surface)}

/* ---- v7: main menu, tab bar, travel ---- */
[hidden]{display:none!important}
.nocloud [data-tab="travel"],.nocloud [data-tab="guests"],.nocloud .tile[href="#travel"],.nocloud .tile[href="#guests"],.nocloud #tv,.nocloud #gl{display:none!important}
.nocloud .tabs-in{grid-template-columns:repeat(3,minmax(0,1fr))}
body{padding-bottom:calc(74px + env(safe-area-inset-bottom,0px))}
body.home .bar{display:none}
.bar .ttl{font-family:var(--display);font-size:22px;font-weight:500;margin-left:auto}
.home-wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.home-wrap .hero{aspect-ratio:4/4.2;max-height:60vh}
@media (min-width:700px){ .home-wrap .hero{aspect-ratio:16/8} }
.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{position:relative;border:1px solid var(--line);background:var(--raised);border-radius:18px;padding:16px 16px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:128px;text-decoration:none;color:var(--ink);transition:transform .15s ease,background-color .2s ease}
.tile:active{transform:scale(.97)}
.tile .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--surface);color:var(--ink)}
.tile .ic svg{width:19px;height:19px}
.tile .tt{font-family:var(--display);font-size:24px;font-weight:600;line-height:1.05;margin-top:auto}
.tile .ts{font-size:12.5px;color:var(--muted);min-height:1.2em}
.tile .ar{position:absolute;top:16px;right:16px;color:var(--muted);font-size:18px}
.tile.accent{background:var(--ink);color:var(--bg);border-color:transparent}
.tile.accent .ic{background:rgba(243,240,230,.12);color:var(--bg)}
.tile.accent .ts,.tile.accent .ar{color:var(--field)}
@media (prefers-reduced-motion:no-preference){ .tile{animation:up .5s calc(.4s + var(--i,0) * 60ms) cubic-bezier(.2,.7,.2,1) both} }

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.tab{border:0;background:transparent;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:500;color:var(--muted);cursor:pointer;letter-spacing:.02em}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--red)}
.pagehead{display:flex;flex-direction:column;gap:4px;margin:2px 0 4px}
.pagehead h1{font-family:var(--display);font-weight:600;font-size:38px;line-height:1;margin:0}
.pagehead p{margin:0;color:var(--muted);font-size:14px}
.page{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

/* travel */
.tvadd{display:flex;flex-direction:column;gap:10px;background:var(--raised);border:1px solid var(--line);border-radius:18px;padding:16px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-weight:600;font-size:15px;padding:12px 16px;border-radius:12px;border:0;background:var(--red);color:var(--onred);cursor:pointer;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.sec{background:var(--surface);color:var(--ink)}
.coffee .cf-note{margin:0 0 12px}
.cflist{list-style:none;margin:0 0 6px;padding:0}
.cflist li{border-top:1px solid var(--line)}
.cflist li:first-child{border-top:0}
.cflist a{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:10px 0;color:var(--ink);text-decoration:none}
.cf-nm{font-weight:600;font-size:15px}
.cf-ad{grid-column:1;font-size:12.5px;color:var(--muted)}
.cf-w{grid-column:2;grid-row:1/3;align-self:center;font-size:12.5px;font-weight:600;color:var(--red);white-space:nowrap}
.coffee .btn{text-decoration:none;flex:1}
.btn.big{flex:1;min-width:200px;padding:15px 16px}
.btn:disabled{opacity:.55}
.btn svg{width:18px;height:18px}
.tvstatus{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:var(--surface);font-size:14px}
.tvstatus img{width:54px;height:54px;object-fit:cover;border-radius:8px;flex:none}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--red);flex:none}
@media (prefers-reduced-motion:no-preference){ .spin{animation:sp 0.8s linear infinite} @keyframes sp{to{transform:rotate(360deg)}} }
.rv{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.rv-h{display:flex;align-items:center;gap:8px;font-weight:600}
.rv-files{font-size:13px;color:var(--deep);font-weight:600}
.rv-files.none{color:var(--muted)}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fgrid label{display:flex;flex-direction:column;gap:3px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500;min-width:0}
.fgrid label.full{grid-column:1/-1}
.fgrid input,.fgrid select,.fgrid textarea{font:inherit;font-size:16px;letter-spacing:0;text-transform:none;color:var(--ink);padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--raised);min-width:0;width:100%}
.fgrid textarea{min-height:58px;resize:vertical}
.kinds{display:flex;gap:6px;flex-wrap:wrap}
.kinds button{font:inherit;font-size:13px;font-weight:500;border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 11px;cursor:pointer;color:var(--ink)}
.kinds button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tvlist{display:flex;flex-direction:column;gap:18px}
.tvlist h2{font-family:var(--display);font-weight:500;font-size:24px;margin:0 0 8px;display:flex;align-items:baseline;gap:8px}
.tvlist h2 a{font-family:var(--sans);font-style:normal;font-size:12.5px;font-weight:600;margin-left:auto;text-decoration:none}
.bk{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px;border-radius:14px;background:var(--raised);border:1px solid var(--line)}
.bk+.bk{margin-top:8px}
.bk .ki{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--surface)}
.bk .ki svg{width:20px;height:20px}
.bk .bt{font-weight:600;font-size:15px}
.bk .bl{font-size:13.5px;margin-top:1px}
.bk .bm{font-size:12.5px;color:var(--muted);margin-top:3px;display:flex;flex-wrap:wrap;gap:2px 12px;overflow-wrap:anywhere}
.bk .bm b{color:var(--ink);font-weight:600;user-select:all}
.bk .side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.bk .thumb{width:46px;height:46px;border-radius:8px;object-fit:cover;border:1px solid var(--line);cursor:zoom-in;padding:0;background:var(--surface)}
.bk .thumb img{width:100%;height:100%;object-fit:cover;border-radius:7px;display:block}
.k-flight .ki{background:var(--sky);color:#00020A}
.k-hotel .ki{background:var(--gum);color:#00020A}
.k-car .ki{background:var(--field);color:#00020A}
.k-train .ki,.k-ground .ki{background:var(--deep);color:#F3F0E6}
.imgv{position:fixed;inset:0;z-index:40;background:rgba(0,2,10,.94);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.imgv .pdfbar{border-color:rgba(243,240,230,.15);color:#F3F0E6}
.imgv .imgbox{flex:1;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:12px 12px calc(20px + env(safe-area-inset-bottom,0px))}
.imgv img{max-width:100%;height:auto;border-radius:8px}
.row .tvtag{display:inline-flex;align-items:center;gap:3px;color:var(--deep);font-weight:600}
.row .tvtag svg{width:12px;height:12px}
.gls{display:flex;flex-direction:column}
</style>

.month-title,.card h3,.list h2,.tvlist h2,.pagehead h1,.tile .tt,.ddate,.dvenue,.nextup .nv,.upnext b,.row .d b,.bar .ttl{font-family:var(--display);font-stretch:125%;font-style:normal}
.pagehead h1{font-weight:800;font-size:34px;letter-spacing:-.01em;text-transform:uppercase}
.list h2,.tvlist h2{font-weight:700;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.card h3{font-size:15px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.tile .tt{font-size:19px;font-weight:800;text-transform:uppercase;letter-spacing:-.005em}
.dvenue,.dhead.photo .dvenue{font-weight:800;font-size:34px;letter-spacing:-.015em;line-height:1}
.ddate{font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin-top:8px}
.nextup .nv{font-weight:800;font-size:28px;letter-spacing:-.01em}
.row .d b{font-weight:800;font-size:24px}
.bar .ttl{font-size:15px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] svg{color:var(--ink);filter:drop-shadow(0 3px 0 var(--lime))}
.tile.accent{background:var(--navy);color:#F3F0E6}
.tile.accent .ic{background:var(--lime);color:#00020A}
.tile.accent .ts,.tile.accent .ar{color:#E0D9C5}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tile.accent{background:var(--lime);color:#00020A} :root:not([data-theme="light"]) .tile.accent .ic{background:#00020A;color:var(--lime)} :root:not([data-theme="light"]) .tile.accent .ts,:root:not([data-theme="light"]) .tile.accent .ar{color:#1B266B} }
.nextup{background:var(--lime);color:#00020A}
.nx{background:var(--lime);color:#00020A}
.st-RSVPyes{background:var(--ink);color:var(--bg)}
.st-Approved{background:#1B266B;color:#F3F0E6}
.btn{background:var(--ink);color:var(--bg)}
.glform button{background:var(--ink);color:var(--bg)}
.sched li.mine .pip{background:var(--ink);border-color:var(--ink);box-shadow:0 0 0 3px var(--lime)}
.cell.today .n{border-color:var(--ink)}
.av.artist{background:var(--navy);color:#F3F0E6}
.dhead.photo .chip.status-Confirmed,.dhead.photo .chip.status-Locked,.dhead.photo .chip.status-Advanced{background:var(--lime);color:#00020A}
.k-flight .ki{background:var(--lime);color:#00020A}
.k-hotel .ki{background:#1B266B;color:#F3F0E6}
.k-car .ki{background:var(--field);color:#00020A}

/* artist filter */
.afilter{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0 4px;margin:0 -2px}
.afilter::-webkit-scrollbar{display:none}
.afilter button{flex:none;font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:7px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:background-color .2s ease,color .2s ease}
.afilter button img{width:20px;height:20px;border-radius:50%;object-fit:cover;margin-left:-5px}
.afilter button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.atag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:2px 7px;border-radius:5px;background:var(--surface);color:var(--ink);margin-right:6px;vertical-align:1px}
.atag.a-macy{background:#E0F666;color:#00020A}
.atag.a-stephen{background:#1B266B;color:#F3F0E6}
.atag.a-colby{background:#00020A;color:#E0D9C5}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .atag.a-colby{background:#E0D9C5;color:#00020A} :root:not([data-theme="light"]) .atag.a-stephen{background:#C7CFFF;color:#00020A} }
.row{grid-template-columns:52px 10px minmax(0,1fr) auto}

/* home hero */
.hero{border-radius:20px;background:#00020A}
.hero .mosaic{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px}
.hero .mosaic img{position:relative;inset:auto;width:100%;height:100%;object-fit:cover}
.hero-shade{background:linear-gradient(180deg,rgba(0,2,10,.05) 30%,rgba(0,2,10,.55) 64%,rgba(0,2,10,.94) 100%)}
.hero-txt{gap:10px}
.logo-big{width:min(190px,52%);background:#F3F0E6}
.hero-name{font-family:var(--display);font-stretch:125%;font-weight:800;font-size:clamp(30px,9vw,54px);line-height:.95;letter-spacing:-.02em;color:#F3F0E6;text-transform:uppercase}
.hero-txt .eyebrow{color:#E0D9C5;display:flex;align-items:center;gap:10px}
.hero-txt .eyebrow .icon-bar{color:var(--lime);width:30px}
.hero-bar{position:absolute;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;z-index:2}
.hero-bar .logo{width:66px;background:#F3F0E6}
.hero-bar .pill{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#00020A;background:var(--lime);border-radius:999px;padding:5px 10px}
@media (prefers-reduced-motion:no-preference){ .hero .mosaic img{animation:kb 22s ease-in-out infinite alternate} .hero .mosaic img:nth-child(2){animation-delay:-7s} .hero .mosaic img:nth-child(3){animation-delay:-14s} }
.rosterline{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none}
.rosterline::-webkit-scrollbar{display:none}
.rcard{flex:1 0 150px;border:1px solid var(--line);background:var(--raised);border-radius:16px;padding:10px;display:flex;gap:10px;align-items:center;cursor:pointer;text-align:left;font:inherit;color:var(--ink);transition:transform .15s ease}
.rcard:active{transform:scale(.97)}
.rcard img{width:44px;height:44px;border-radius:12px;object-fit:cover;flex:none}
.rcard b{display:block;font-family:var(--display);font-stretch:115%;font-weight:700;font-size:14px}
.rcard span{font-size:12px;color:var(--muted)}

/* day sheet extras */
.flags{background:var(--lime);color:#00020A;border:0}
.flags h3 small{color:#1B266B}
.flags ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.links{display:flex;flex-direction:column;gap:6px}
.links a{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:12px;background:var(--surface);color:var(--ink);text-decoration:none;font-size:14px;font-weight:500}
.pipeline{border:1.5px dashed var(--line);border-radius:16px;padding:14px 16px;font-size:14px;color:var(--ink);background:transparent}
.pipeline b{display:block;font-family:var(--display);font-stretch:125%;font-size:13px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.filesec h2{margin:6px 0 8px}
.doc.img .pdf{color:var(--deep)}
button.doc{border:0;width:100%;text-align:left;font:inherit;cursor:pointer}
.foot{text-transform:uppercase}
/* merch */
.mrep{display:flex;flex-direction:column;gap:10px}
.mt{font-family:var(--display);font-stretch:115%;font-weight:800;font-size:17px;line-height:1.15}
.ms{font-size:12.5px;color:var(--muted);margin-top:2px}
.mnet{display:flex;justify-content:space-between;align-items:baseline;padding:2px 12px;font-size:13px}
.mnet b{font-family:var(--display);font-stretch:115%;font-size:15px}
.mstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:8px}
.mstats div{background:var(--surface);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column}
.mstats b{font-family:var(--display);font-stretch:115%;font-weight:800;font-size:17px}
.mstats span{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.mbest{font-size:13px}
.mitems,.mshows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.mitems li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px}
.mitems li span:last-child{color:var(--muted);white-space:nowrap}
.mshows li{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px;align-items:center}
.mshows .md{font-weight:600;font-variant-numeric:tabular-nums}
.mshows small{display:block;font-size:11.5px;color:var(--muted)}
.mshows .mg{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
/* deals */
.atab{flex:none;font-size:13px;font-weight:600;border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:7px 13px;display:inline-flex;align-items:center;gap:7px;text-decoration:none}
.atab img{width:20px;height:20px;border-radius:50%;object-fit:cover;margin-left:-5px}
.atab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dmenu{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:700px){ .dmenu{grid-template-columns:repeat(3,minmax(0,1fr))} .dtile{aspect-ratio:3/4!important} }
.dtile{position:relative;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#00020A;color:#F3F0E6;text-decoration:none;display:block;transition:transform .15s ease}
.dtile:active{transform:scale(.97)}
.dtile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dt-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,2,10,0) 35%,rgba(0,2,10,.9) 100%)}
.dt-txt{position:absolute;left:14px;right:14px;bottom:14px;display:flex;flex-direction:column;gap:3px}
.dt-txt b{font-family:var(--display);font-stretch:125%;font-weight:800;font-size:20px;text-transform:uppercase;line-height:1}
.dt-txt span{font-size:12.5px;color:#E0D9C5}
.dt-txt .dt-next{align-self:flex-start;margin-top:4px;background:var(--lime);color:#00020A;font-weight:600;font-size:11.5px;border-radius:999px;padding:3px 9px}
.dtile .ar{position:absolute;top:12px;right:14px;font-size:20px;color:#F3F0E6}
@media (prefers-reduced-motion:no-preference){ .dtile{animation:up .5s calc(.1s + var(--i,0) * 70ms) cubic-bezier(.2,.7,.2,1) both} }
.terms summary{cursor:pointer;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);list-style:none;display:flex;justify-content:space-between}
.terms summary::-webkit-details-marker{display:none}
.terms summary::after{content:"+";font-size:16px;line-height:1}
.terms[open] summary::after{content:"−"}
.terms[open] summary{margin-bottom:10px}
.tile.wide{grid-column:1/-1;min-height:96px}
.dealsec{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.dealsec-h{display:flex;gap:12px;align-items:center;padding:4px 0 2px;border-bottom:2px solid var(--ink)}
.dealsec-h img{width:48px;height:48px;border-radius:12px;object-fit:cover}
.dealsec-h h2{margin:0;font-family:var(--display);font-stretch:125%;font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:-.01em}
.dealsec-h p{margin:2px 0 6px;font-size:12.5px;color:var(--muted)}
.dealsec .mh{margin:8px 0 0;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.deal{display:flex;flex-direction:column;gap:10px}
.dl-head{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;border:0;background:none;padding:0;text-align:left;font:inherit;color:var(--ink);cursor:pointer;width:100%}
.dl-head .d{display:flex;flex-direction:column;align-items:center;line-height:1}
.dl-head .d b{font-family:var(--display);font-stretch:125%;font-weight:800;font-size:22px}
.dl-head .d span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.dl-head .v{font-weight:600}.dl-head .c{font-size:12.5px;color:var(--muted)}.dl-head .s{color:var(--muted)}
.gtee{display:flex;justify-content:space-between;align-items:baseline;gap:10px;background:var(--lime);color:#00020A;border-radius:12px;padding:10px 12px}
.gtee span{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.gtee b{font-family:var(--display);font-stretch:115%;font-weight:800;font-size:18px;text-align:right}


/* ---- management: writes ---- */
.wweek{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--ink);background:var(--raised);border:1px solid var(--line);border-left:4px solid var(--navy);border-radius:16px;padding:14px 16px}
.wweek .wl{font-size:14px;line-height:1.35}
.wweek .wl b{font-family:var(--display);font-stretch:115%;font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase;margin-right:4px}
.wweek .go{font-size:12.5px;font-weight:600;color:var(--muted);margin-top:2px}
.wrow{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;padding:12px 4px;border-top:1px solid var(--line);align-items:start}
.wrow .d{display:flex;flex-direction:column;align-items:center;line-height:1;padding-top:2px}
.wrow .d b{font-family:var(--display);font-stretch:125%;font-weight:800;font-size:24px}
.wrow .d span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.wwho{font-weight:600;font-size:15.5px;line-height:1.3}
.wwho>span{font-weight:400;color:var(--muted)}
.wmeta{font-size:13px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
.wst{color:var(--ink);background:var(--lime);border-radius:5px;padding:1px 6px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#00020A}

<script>
window.startApp=function(){
const T = window.TOUR, A = T.artists, AK = Object.keys(A);
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const pd=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const key=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=new Date(); today.setHours(0,0,0,0); const todayKey=key(today);
const byId={}, byDate={}; T.days.forEach(d=>{byId[d.id]=d;(byDate[d.date]=byDate[d.date]||[]).push(d)});
const sorted=[...T.days].sort((a,b)=>a.date.localeCompare(b.date)||a.artist.localeCompare(b.artist));
const TYPE={show:"Show",rehearsal:"Rehearsal",travel:"Travel",other:"Day"};
const shortDate=k=>pd(k).toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});
const aName=k=>(A[k]||{}).name||"";
const atag=k=>A[k]?`<span class="atag a-${k}">${esc(A[k].short)}</span>`:"";
document.getElementById("upd").textContent=T.updated;

let state={view:"home", dealA:null, guestA:null, merchA:null, mktA:null, musA:null, wrPast:false, sel:null, tdate:null, showPast:false, from:"dates", anchor:null, artist:"all"};
try{ const p=localStorage.getItem("hy-showpast"); if(p) state.showPast=p==="1"; const a=localStorage.getItem("hy-artist"); if(a&&(a==="all"||A[a])) state.artist=a; }catch(e){}
const inA=d=>state.artist==="all"||d.artist===state.artist;
const vis=()=>sorted.filter(inA);
const nextOf=list=>list.find(d=>d.date>=todayKey)||null;

const VIEWS=["home","touring","dates","guests","files","deals","merch","marketing","music","player","writes","keys"];
const TOURING=["touring","dates","guests","files","deals","merch"];
function readHash(){
  const h=location.hash.slice(1);
  let m=h.match(/^d-([a-z]+-\d{4}-\d{2}-\d{2})(?:-(gl|tv))?$/);
  if(m&&byId[m[1]]){ if(state.view!=="day"&&state.view!=="tday") state.from=state.view; state.view="day"; state.sel=m[1]; state.anchor=m[2]||null; return; }
  m=h.match(/^(deals|guests|merch|marketing|music|player|writes)-([a-z]+)$/);
  if(m&&A[m[2]]){ state.view=m[1]; state[{deals:"dealA",guests:"guestA",merch:"merchA",marketing:"mktA",music:"musA",player:"musA",writes:"wrA"}[m[1]]]=m[2]; if(m[1]==="writes") state.musA=m[2]; return; }
  if(h==="writes") state.wrA=null;
  if(h==="keys") state.keyA=null;
  m=h.match(/^keys-([a-z]+)$/); if(m&&A[m[1]]){ state.view="keys"; state.keyA=m[1]; return; }
  if(h==="player") { state.view="music"; state.musA=null; return; }
  if(h==="marketing") state.mktA=null;
  if(h==="music"||h==="player") state.musA=null;
  if(h==="merch") state.merchA=null;
  if(h==="deals") state.dealA=null;
  if(h==="guests") state.guestA=null;
  m=h.match(/^t-(\d{4}-\d{2}-\d{2})$/);
  if(m){ if(state.view!=="day"&&state.view!=="tday") state.from=state.view; state.view="tday"; state.tdate=m[1]; state.anchor=null; return; }
  state.view=VIEWS.includes(h)?h:"home";
}
function go(h){ if(location.hash!=="#"+h){ location.hash=h; } else { readHash(); render(); } }
function setArtist(a){ state.artist=a; try{localStorage.setItem("hy-artist",a)}catch(e){} render(); }

function scheduleFor(d){
  if(d.schedule) return d.schedule;
  if(d.sasha){ // Macy Todd on the Sasha Alex Sloan run
    return [
      {t:null,label:"Load-in"},{t:null,label:"Soundcheck"},{t:"7:00 PM",label:"Doors"},
      {t:"8:00 PM",end:"8:40 PM",label:"Macy Todd",mine:true,sub:d.sasha.setConfirmed?"Set time confirmed by venue":"30–40 min"},
      {t:null,label:"Sasha Alex Sloan",sub:"After Macy"},
      {t:d.sasha.curfew,label:"Curfew"}
    ];
  }
  return [];
}
function photoFor(d){ const a=A[d.artist]||{}; const ph=[a.wide,...(a.alt||[])].filter(Boolean); let h=0; for(const c of d.date) h=(h*31+c.charCodeAt(0))>>>0; return ph[h%ph.length]||""; }
function initials(n){return n.replace(/!/g,"").split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase()}
function filterBar(){
  return `<div class="afilter" role="group" aria-label="Artist"><button data-artist="all" aria-pressed="${state.artist==="all"}">All artists</button>${AK.map(k=>`<button data-artist="${k}" aria-pressed="${state.artist===k}"><img src="${esc(A[k].tall)}" alt="">${esc(A[k].name)}</button>`).join("")}</div>`;
}

// ---- Travel (shared, stored in the artifact's database) ----
const KINDS={flight:"Flight",hotel:"Hotel",car:"Rental car",train:"Train",ground:"Ride / shuttle",other:"Other"};
const KI={
  flight:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 13.5 4 11l1.3-1.3 7 .6 4.2-4.2a1.8 1.8 0 0 1 2.6 2.6l-4.2 4.2.6 7L14.2 21l-2.5-6.5-3.2 3.2.3 2.3-1 1-1.6-3.1L3.1 16.3l1-1 2.3.3z"/></svg>',
  hotel:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18.5V7M3 14h18v4.5M21 14v-2.5a3 3 0 0 0-3-3h-7V14"/><circle cx="7" cy="10.7" r="1.8"/></svg>',
  car:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16.5v-4l2-5h12l2 5v4z"/><path d="M4 12.5h16"/><circle cx="7.5" cy="16.5" r="1.7"/><circle cx="16.5" cy="16.5" r="1.7"/></svg>',
  train:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="3.5" width="12" height="13" rx="3"/><path d="M6 10.5h12M9 20.5l1.5-4M15 20.5l-1.5-4"/><circle cx="9.5" cy="13.5" r=".6"/><circle cx="14.5" cy="13.5" r=".6"/></svg>',
  ground:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg>',
  other:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4.5" width="16" height="15" rx="2.5"/><path d="M8 9.5h8M8 13h8M8 16.5h5"/></svg>'
};
const LBL={
  flight:{title:"Airline + flight",from:"From",to:"To",start:"Departs",end:"Arrives",date:"Date",endDate:"Arrival date (if next day)",address:"Terminal / gate",conf:"Confirmation"},
  hotel:{title:"Hotel",from:"",to:"",start:"Check-in time",end:"Check-out time",date:"Check-in date",endDate:"Check-out date",address:"Address",conf:"Confirmation"},
  car:{title:"Rental company",from:"Pick-up location",to:"Drop-off location",start:"Pick-up time",end:"Drop-off time",date:"Pick-up date",endDate:"Drop-off date",address:"Vehicle",conf:"Confirmation"},
  train:{title:"Line + train",from:"From",to:"To",start:"Departs",end:"Arrives",date:"Date",endDate:"Arrival date (if next day)",address:"Car / seat",conf:"Confirmation"},
  ground:{title:"Company",from:"Pick-up",to:"Drop-off",start:"Pick-up time",end:"",date:"Date",endDate:"",address:"Driver / vehicle",conf:"Confirmation"},
  other:{title:"What",from:"From",to:"To",start:"Start time",end:"End time",date:"Date",endDate:"End date",address:"Where",conf:"Confirmation"}
};
const FIELDS=["title","from","to","start","end","address","conf","who","notes"];
let TRAVEL=[], PENDING=[], tvUnsub=null, tvLoaded=false;
const bkA=(b,a)=>!a||a==="all"||!b.artist||b.artist===a;
const travelOn=(k,a)=>TRAVEL.filter(b=>bkA(b,a)&&(b.date===k||(b.endDate&&b.date<k&&k<=b.endDate&&(b.kind==="hotel"||b.kind==="car"))));
const travelDates=()=>[...new Set(TRAVEL.filter(b=>bkA(b,state.artist)).map(b=>b.date).filter(Boolean))];
function dayLabel(k,a){ const d=(byDate[k]||[]).find(x=>!a||x.artist===a); return shortDate(k)+(d?` · ${d.city}${d.type==="show"?", "+d.venue:""}`:" · no show that day"); }
function bkLine(b,k){
  if(b.kind==="hotel"){ if(k&&b.endDate===k) return "Check out"+(b.end?" by "+b.end:""); if(k&&k>b.date) return "Staying here"+(b.endDate?" · out "+shortDate(b.endDate):""); return "Check in"+(b.start?" "+b.start:"")+(b.endDate?" · out "+shortDate(b.endDate):""); }
  if(b.kind==="car"&&k&&k>b.date) return (b.endDate===k?"Drop off":"Rental out")+(b.endDate===k&&b.end?" "+b.end:"")+(b.to?" · "+b.to:"");
  const route=[b.from,b.to].filter(Boolean).join(" → ");
  const times=[b.start,b.end].filter(Boolean).join(" – ");
  return [route,times].filter(Boolean).join(" · ");
}
function bookingHtml(b,k,opts={}){
  const can=CANEDIT||(ME&&b.addedBy===ME);
  const L=LBL[b.kind]||LBL.other;
  const meta=[b.conf&&`${esc(L.conf)} <b>${esc(b.conf)}</b>`, b.address&&esc(b.address), b.who&&esc(b.who), b.notes&&esc(b.notes)].filter(Boolean);
  if(b.kind==="hotel"&&b.address) meta[meta.indexOf(esc(b.address))]=`${esc(b.address)} <a href="https://maps.apple.com/?q=${encodeURIComponent(b.address)}" target="_blank" rel="noopener">Maps</a>`;
  return `<div class="bk k-${esc(b.kind)}"><span class="ki">${KI[b.kind]||KI.other}</span><div><div class="bt">${opts.tag&&b.artist?atag(b.artist):""}${esc(b.title||KINDS[b.kind])}</div>${bkLine(b,k)?`<div class="bl">${esc(bkLine(b,k))}</div>`:""}${meta.length?`<div class="bm">${meta.map(m=>`<span>${m}</span>`).join("")}</div>`:""}</div>
    <div class="side">${b.imageUrl?`<button class="thumb" data-img="${esc(b.imageUrl)}" aria-label="View screenshot"><img src="${esc(b.imageUrl)}" alt="" loading="lazy"></button>`:""}${can?`<button class="glx" data-tvdel="${esc(b.id)}" aria-label="Remove">×</button>`:""}</div></div>`;
}
function travelCard(k,a){ return `<section class="card" id="tv" data-date="${k}" data-artist="${a||""}"><h3>Travel <small><a href="#travel">Add travel ›</a></small></h3><div id="tvbody">${travelCardBody(k,a)}</div></section>`; }
function travelCardBody(k,a){
  if(!DB&&dbTried) return '<div class="empty">Sign in to claude.ai to see travel.</div>';
  if(!tvLoaded) return '<div class="empty">Loading travel…</div>';
  const bs=travelOn(k,a).sort((x,y)=>(x.start||"").localeCompare(y.start||""));
  const d=(byDate[k]||[]).find(x=>x.artist===a);
  return (bs.length?bs.map(b=>bookingHtml(b,k,{tag:!a})).join(""):'<div class="empty">No flights, hotels or cars filed for this date yet. Add a screenshot in Travel.</div>')+(d&&d.travel?`<div class="note">From the advance: ${esc(d.travel)}</div>`:"");
}
function refreshTravelBits(){
  const tv=document.getElementById("tv"); const tb=document.getElementById("tvbody"); if(tb&&tv) tb.innerHTML=travelCardBody(tv.dataset.date,tv.dataset.artist||null);
  const tl=document.getElementById("tvlist"); if(tl) tl.innerHTML=travelListHtml();
  const tc=document.getElementById("cnt-travel"); if(tc) tc.textContent=travelCount();
  if(state.view==="dates"){ const dl=document.getElementById("dlist"); if(dl){ dl.innerHTML=datesListHtml(); bindRows(dl); } }
}
function travelCount(){ if(!DB&&dbTried) return "Flights, hotels, cars"; if(!tvLoaded) return "Loading…"; const up=TRAVEL.filter(b=>bkA(b,state.artist)&&(b.endDate||b.date)>=todayKey).length; return up?`${up} upcoming booking${up===1?"":"s"}`:"Add a ticket or hotel"; }
async function mountTravelFeed(){
  await dbReady; if(!DB||tvUnsub) { refreshTravelBits(); return; }
  const timer=setTimeout(()=>{ if(!tvLoaded){ tvLoaded=true; refreshTravelBits(); } },10000);
  tvUnsub=DB.collection("travel").onSnapshot(s=>{ clearTimeout(timer); const all=s.docs.map(d=>({id:d.id,...d.data()})); PENDING=all.filter(b=>b.status==="pending"); TRAVEL=all.filter(b=>b.date&&b.status!=="pending"); tvLoaded=true; refreshTravelBits(); }, e=>{ clearTimeout(timer); tvLoaded=true; refreshTravelBits(); });
}
function travelListHtml(){
  if(!DB&&dbTried) return '<div class="empty">Sign in to claude.ai to see and add travel.</div>';
  if(!tvLoaded) return '<div class="empty">Loading travel…</div>';
  const bs=TRAVEL.filter(b=>bkA(b,state.artist)&&(state.showPast||(b.endDate||b.date)>=todayKey)).sort((a,b)=>a.date.localeCompare(b.date)||(a.start||"").localeCompare(b.start||""));
  const pn=PENDING.length?`<div class="tvstatus"><span class="spin" style="animation:none;border-top-color:var(--field)"></span><span>${PENDING.length} screenshot${PENDING.length===1?"":"s"} waiting to be read. ${PENDING.length===1?"It gets":"They get"} filed on the right date by the next morning.</span></div>`:"";
  if(!bs.length) return pn+'<div class="empty">Nothing filed yet. Add the first screenshot above.</div>';
  const g={}; bs.forEach(b=>{(g[b.date]=g[b.date]||[]).push(b)});
  return pn+Object.entries(g).map(([k,list])=>{ const d=(byDate[k]||[]).find(x=>inA(x)&&(!list[0].artist||x.artist===list[0].artist)); return `<section><h2>${esc(shortDate(k))}<a href="#${d?"d-"+d.id:"t-"+k}">${esc(d?d.city:"Travel day")} ›</a></h2>${list.map(b=>bookingHtml(b,k,{tag:state.artist==="all"})).join("")}</section>`; }).join("");
}

// Reading a screenshot
async function toJpeg(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;});
    const s=Math.min(1,2000/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement("canvas"); c.width=Math.round(img.naturalWidth*s); c.height=Math.round(img.naturalHeight*s);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    return await new Promise(res=>c.toBlob(b=>res(b),"image/jpeg",.86));
  } finally { URL.revokeObjectURL(url); }
}
function readPrompt(){
  const days=sorted.filter(d=>d.date>=todayKey).map(d=>`${d.date} ${A[d.artist].name} [${d.artist}] – ${d.city} – ${d.venue} (${TYPE[d.type]})`).join("\n");
  return `You read travel confirmations for Hyphen Management's touring artists (Macy Todd, Stephen Stanley and colby!) and their road teams. Look at the attached screenshot (an airline ticket, boarding pass, hotel confirmation, rental car reservation, train ticket, rideshare or shuttle booking, or similar) and pull out every booking in it. Each flight leg, hotel stay, rental car, train or ride is its own booking.

Today is ${todayKey}. Upcoming tour calendar (date, artist [key], city, venue):
${days}

Use the calendar to pick the right year when the screenshot leaves it out, and to pick the artist when the traveler names, cities and dates make it clear. Leave artist empty if it isn't clear.

Reply with only JSON in this shape:
{"bookings":[{"artist":"macy|stephen|colby|","kind":"flight|hotel|car|train|ground|other","date":"YYYY-MM-DD","endDate":"YYYY-MM-DD or empty","title":"","from":"","to":"","start":"","end":"","address":"","conf":"","who":"","notes":""}]}

Field rules:
- kind: flight; hotel; car (rental car); train; ground (rideshare, car service, shuttle); other.
- date: flight or train departure date, hotel check-in date, rental pick-up date.
- endDate: hotel check-out date, rental drop-off date, or arrival date only if a flight lands on a later day. Otherwise empty.
- title: short label, like "Delta 1234", "Ace Hotel Toronto", "Hertz", "Amtrak 171".
- from / to: departure and arrival city with airport code, or rental pick-up and drop-off location. Empty for hotels.
- start / end: local times like "7:05 AM".
- address: hotel street address; for a rental car the vehicle class; for a flight the terminal or gate; for a train the car and seat.
- conf: confirmation number or record locator.
- who: traveler or guest names, comma separated.
- notes: seat numbers, room type, bags, or other useful detail, one short line.
Leave out prices, totals, payment card numbers and loyalty or frequent-flyer numbers. Use an empty string for anything you cannot read clearly rather than guessing. If the image is not a travel booking, reply {"bookings":[]}.`;
}
let SAMPLE=null, ASSETS=null, imgOK=false;
const capsReady=(async()=>{ try{ if(!window.claude) return; SAMPLE=await claude.use("sample"); ASSETS=await claude.use("assets"); if(SAMPLE){ const l=await SAMPLE.limits().catch(()=>null); imgOK=!!(l&&l.images); } }catch(e){} })();

function dateOptions(sel,a){
  const ks=[...new Set([...sorted.filter(d=>!a||d.artist===a).map(d=>d.date),sel].filter(Boolean))].filter(k=>k>=todayKey||k===sel).sort();
  return ks.map(k=>`<option value="${k}" ${k===sel?"selected":""}>${esc(dayLabel(k,a))}</option>`).join("")+`<option value="__other">Another date…</option>`;
}
function reviewForm(b,i){
  b=Object.assign({kind:"flight",date:"",endDate:"",artist:state.artist!=="all"?state.artist:""},b||{}); if(!KINDS[b.kind]) b.kind="other"; if(!A[b.artist]) b.artist="";
  const L=LBL[b.kind];
  const f=(n,cls="")=>L[n]===""?"":`<label class="${cls}">${esc(L[n]||({who:"Travelers",notes:"Notes"})[n])}<input name="${n}" value="${esc(b[n]||"")}" autocomplete="off"></label>`;
  return `<form class="rv" data-i="${i}">
    <div class="kinds" role="group" aria-label="Type">${Object.entries(KINDS).map(([k,v])=>`<button type="button" data-kind="${k}" aria-pressed="${k===b.kind}">${v}</button>`).join("")}</div>
    <input type="hidden" name="kind" value="${b.kind}">
    <div class="fgrid">
      <label class="full">Artist<select name="artist"><option value="" ${b.artist?"":"selected"}>Pick an artist…</option>${AK.map(k=>`<option value="${k}" ${k===b.artist?"selected":""}>${esc(A[k].name)}</option>`).join("")}</select></label>
      ${f("title","full")}
      <label class="full">${esc(L.date)}<select name="date">${dateOptions(b.date,b.artist||null)}</select><input name="dateOther" type="date" value="${esc(b.date)}" hidden></label>
      ${f("from")}${f("to")}${f("start")}${f("end")}
      ${L.endDate?`<label class="full">${esc(L.endDate)}<input name="endDate" type="date" value="${esc(b.endDate||"")}"></label>`:""}
      ${f("address","full")}${f("conf")}${f("who")}
      <label class="full">Notes<textarea name="notes">${esc(b.notes||"")}</textarea></label>
    </div>
    <div class="rv-files" data-files></div>

function formData(form){
  const g=n=>{const el=form.elements[n]; return el?el.value.trim():"";};
  let date=g("date"); if(date==="__other") date=g("dateOther");
  const b={kind:g("kind"),date,endDate:g("endDate"),artist:g("artist")};

}
function wireForm(form,draft,onDone){
  const upd=()=>{ const b=formData(form); const el=form.querySelector("[data-files]"); const sel=form.elements.date; form.elements.dateOther.hidden=sel.value!=="__other";
    if(!b.artist){ el.textContent="Pick which artist this is for."; el.className="rv-files none"; return; }
    if(!b.date){ el.textContent="Pick a date to file it on."; el.className="rv-files none"; return; }
    const has=(byDate[b.date]||[]).some(x=>x.artist===b.artist);
    el.className="rv-files"+(has?"":" none"); el.textContent=`Files on ${A[b.artist].name} · ${dayLabel(b.date,b.artist)}`+(has?"":" (shows as a travel day)"); };
  form.addEventListener("input",upd); form.addEventListener("change",upd); upd();
  const rebuild=cur=>{ const tmp=document.createElement("div"); tmp.innerHTML=reviewForm(cur,form.dataset.i); const nf=tmp.firstElementChild; form.replaceWith(nf); wireForm(nf,draft,onDone); };
  form.elements.artist.addEventListener("change",()=>rebuild(formData(form)));
  form.querySelectorAll("[data-kind]").forEach(btn=>btn.onclick=()=>{ const cur=formData(form); cur.kind=btn.dataset.kind; rebuild(cur); });
  form.querySelector("[data-discard]").onclick=()=>{ form.remove(); onDone&&onDone(); };
  form.onsubmit=async e=>{ e.preventDefault(); const b=formData(form); const btn=form.querySelector("button[type=submit]");
    if(!b.date||!b.artist){ upd(); return; } if(!DB){ alertMsg("Sign in to claude.ai to save travel."); return; }
    btn.disabled=true; btn.textContent="Saving…";
    try{
      await DB.collection("travel").add({...b, imageId:draft.imageId||"", imageUrl:draft.imageUrl||"", addedBy:ME||"", addedAt:new Date().toISOString(), source:draft.imageId||draft.read?"screenshot":"app"});
      const d=(byDate[b.date]||[]).find(x=>x.artist===b.artist);
      const done=document.createElement("div"); done.className="tvstatus"; done.innerHTML=`<span>Saved. It's on <a href="#${d?"d-"+d.id:"t-"+b.date}">${esc(A[b.artist].short)} · ${esc(dayLabel(b.date,b.artist))}</a>.</span>`; form.replaceWith(done); setTimeout(()=>{ if(done.isConnected) done.remove(); onDone&&onDone(); },6000);
    }catch(err){ btn.disabled=false; btn.textContent="Save to this date"; alertMsg(err&&err.code==="not_granted"?"You can view travel but not add to it. Ask Drake for edit access.":"That didn't save. Try again."); }
  };
}
function alertMsg(t){ const m=document.getElementById("tvmsg"); if(m){ m.hidden=false; m.textContent=t; } }
async function handleShot(file){
  const out=document.getElementById("tvreview"), msg=document.getElementById("tvmsg"); msg.hidden=true;
  const prev=URL.createObjectURL(file);
  out.innerHTML=`<div class="tvstatus"><img src="${prev}" alt=""><span class="spin"></span><span id="tvst">Reading the screenshot…</span></div>`;
  let jpeg; try{ jpeg=await toJpeg(file); }catch(e){ out.innerHTML=""; alertMsg("That image couldn't be opened. Try a PNG or JPG screenshot."); return; }
  const draft={read:true};
  const up=(async()=>{ if(!ASSETS) return; try{ const r=await ASSETS.upload(jpeg); draft.imageId=r.id; draft.imageUrl=r.url; }catch(e){} })();
  let bookings=[];
  try{
    const r=await SAMPLE.json(readPrompt(),{images:[jpeg]});
    bookings=(r&&Array.isArray(r.bookings))?r.bookings:[];
  }catch(e){
    await up;
    if(e&&e.code==="no_key"){
      try{ await DB.collection("travel").add({kind:"other",date:"",artist:state.artist!=="all"?state.artist:"",status:"pending",imageId:draft.imageId||"",imageUrl:draft.imageUrl||"",addedBy:ME||"",addedAt:new Date().toISOString(),source:"screenshot"});
        out.innerHTML=`<div class="tvstatus"><img src="${prev}" alt=""><span>Saved. This one gets read and filed on the right date by tomorrow morning. Need it sooner? Enter it by hand.</span></div>`; return;
      }catch(err){}
    }
    out.innerHTML="";
    alertMsg(e&&e.code==="no_key"?"Screenshot reading isn't switched on yet. Enter it by hand for now.":e&&e.code==="not_granted"?"Reading screenshots needs your OK to use Claude. You can still enter it by hand.":e&&e.code==="rate_limited"?"Too many at once. Wait a minute and try again.":"Couldn't read that one. Enter it by hand below, or try a clearer screenshot.");
    showManual(draft); return;
  }
  await up;
  if(!bookings.length){ out.innerHTML=""; alertMsg("No booking found in that image. Enter it by hand, or try another screenshot."); showManual(draft); return; }
  const st=document.getElementById("tvst"); if(st) st.textContent=`Found ${bookings.length} booking${bookings.length===1?"":"s"}. Check the artist and details, then save.`;
  out.querySelector(".spin")?.remove();
  bookings.forEach((b,i)=>{ if(!b.artist&&state.artist!=="all") b.artist=state.artist; const tmp=document.createElement("div"); tmp.innerHTML=reviewForm(b,i); const f=tmp.firstElementChild; out.appendChild(f); wireForm(f,draft,()=>{ if(!out.querySelector("form")) setTimeout(()=>{ if(!out.querySelector("form")) out.innerHTML=""; },50); }); });
}
function showManual(draft){
  const out=document.getElementById("tvreview"); const n=nextOf(vis()); const tmp=document.createElement("div"); tmp.innerHTML=reviewForm({kind:"flight",date:n?n.date:"",artist:state.artist!=="all"?state.artist:(n?n.artist:"")},0);

}

let DB=null, USER=null, ME=null, CANEDIT=false, glUnsub=null, glRows=[], dbTried=false;
const dbReady=(async()=>{ try{ if(!window.claude) return; DB=await claude.use("db"); USER=await claude.use("user"); if(USER){ ME=await USER.id().catch(()=>null); CANEDIT=!!(USER.canEdit&&USER.canEdit()); } }catch(e){} finally{ dbTried=true; } })();
const STATUS_ORDER={"Approved":0,"RSVP yes":1,"Requested":2,"Invited":3};
function glRender(){
  const box=document.getElementById("gllist"); if(!box) return;
  const q=(document.getElementById("gl-q")||{}).value?.toLowerCase()||"";
  const total=glRows.reduce((n,r)=>n+1+(r.plus?1:0),0);
  const cnt=document.getElementById("glcount"); if(cnt) cnt.textContent=glRows.length?`${glRows.length} names · ${total} with +1s`:"No guests yet";
  const qi=document.getElementById("gl-q"); if(qi) qi.hidden=glRows.length<8;

  if(!glRows.length){ box.innerHTML='<div class="empty">Nobody on the list yet. Add the first guest above.</div>'; return; }
  const groups={}; rows.forEach(r=>{(groups[r.category||"Other"]=groups[r.category||"Other"]||[]).push(r)});
  box.innerHTML=Object.entries(groups).sort((a,b)=>b[1].length-a[1].length).map(([g,rs])=>`<details class="glgroup" ${rs.length<=12||q?"open":""}><summary>${esc(g)} <span>${rs.length}</span></summary>`+
    rs.sort((a,b)=>(STATUS_ORDER[a.status]??9)-(STATUS_ORDER[b.status]??9)||a.name.localeCompare(b.name)).map(r=>{
      const mine=ME&&r.addedBy===ME, can=CANEDIT||mine;
      return `<div class="glitem"><div class="gli-main"><div class="nm">${esc(r.name)}${r.plus?' <span class="plus">+1</span>':""}</div>${r.company?`<div class="rl">${esc(r.company)}</div>`:""}</div>
        ${CANEDIT?`<button class="st st-${esc((r.status||"").replace(/\s/g,""))}" data-st="${esc(r.id)}" title="Change status">${esc(r.status||"Requested")}</button>`:`<span class="st st-${esc((r.status||"").replace(/\s/g,""))}">${esc(r.status||"Requested")}</span>`}
        ${can?`<button class="glx" data-del="${esc(r.id)}" aria-label="Remove ${esc(r.name)}">×</button>`:""}</div>`}).join("")+`</details>`).join("")||'<div class="empty">No matches.</div>';

async function mountGuestList(){
  if(glUnsub){ try{glUnsub()}catch(e){} glUnsub=null; }
  const sec=document.getElementById("gl"); if(!sec) return;
  const gid=sec.dataset.gl; glRows=[];
  await dbReady;
  if(!document.getElementById("gl")||document.getElementById("gl").dataset.gl!==gid) return;
  const box=document.getElementById("gllist"), form=document.getElementById("glform");
  if(!DB){ box.innerHTML='<div class="empty">Sign in to claude.ai to see and add guests.</div>'; form.hidden=true; document.getElementById("glcount").textContent=""; return; }
  const col=DB.collection("guests/"+gid+"/entries");
  const timer=setTimeout(()=>{ if(!glRows.length) box.innerHTML='<div class="empty">The guest list is taking a while to load. Check your connection.</div>'; },10000);
  glUnsub=col.onSnapshot(s=>{ clearTimeout(timer); glRows=s.docs.map(d=>({id:d.id,...d.data()})); glRender(); },
    e=>{ clearTimeout(timer); box.innerHTML='<div class="empty">The guest list couldn\'t load right now.</div>'; });
  document.getElementById("gl-q").oninput=glRender;
  form.onsubmit=async e=>{ e.preventDefault();
    const name=document.getElementById("gl-name").value.trim(); if(!name) return;
    const msg=document.getElementById("glmsg"), btn=form.querySelector("button[type=submit]"); btn.disabled=true;
    try{ await col.add({name, company:document.getElementById("gl-co").value.trim(), category:document.getElementById("gl-cat").value, plus:document.getElementById("gl-plus").checked?1:0, status:"Requested", addedBy:ME||"", addedAt:new Date().toISOString(), source:"app"});
      form.reset(); msg.hidden=false; msg.textContent=`Added ${name}. Drake will confirm it with the venue.`; setTimeout(()=>{msg.hidden=true},4000);
    }catch(err){ msg.hidden=false; msg.textContent= err&&err.code==="not_granted"?"You can view this list but not add to it. Ask Drake for edit access.":"That didn't save. Try again."; }
    btn.disabled=false; };
  box.onclick=async e=>{
    const del=e.target.closest("[data-del]"), st=e.target.closest("[data-st]");
    try{
      if(del){ const r=glRows.find(x=>x.id===del.dataset.del); if(!r) return;
        if(del.dataset.confirm!=="1"){ del.dataset.confirm="1"; del.textContent="Remove?"; del.classList.add("sure"); setTimeout(()=>{ if(del.isConnected){del.dataset.confirm="";del.textContent="×";del.classList.remove("sure")} },3000); return; }
        await col.doc(r.id).delete(); }
      if(st){ const r=glRows.find(x=>x.id===st.dataset.st); if(!r) return; const cyc=["Requested","Approved","Invited","RSVP yes"]; const nx=cyc[(cyc.indexOf(r.status)+1)%cyc.length]; await col.doc(r.id).update({status:nx}); }
    }catch(err){}
  };
}

function paintTape(){

  document.body.classList.toggle("tape-on",on);
  const d=au.duration||(curT()||{}).dur||0, p=d?Math.min(1,(au.currentTime||0)/d):0;

// audio files on the hosted site are encrypted; the key rides inside the locked data
const b64u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let mediaKey=null;
// decrypted files are kept for the current, previous and next song so skipping is instant
const blobCache=new Map();
async function srcFor(t){
  if(!T.mediaKey) return t.file;
  if(blobCache.has(t.file)) return blobCache.get(t.file);
  const job=(async()=>{
    if(!mediaKey) mediaKey=await crypto.subtle.importKey("raw",b64u(T.mediaKey),"AES-GCM",false,["decrypt"]);
    const r=await fetch(t.file+".enc"); if(!r.ok) throw new Error("fetch "+r.status);
    const buf=new Uint8Array(await r.arrayBuffer());
    const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:buf.slice(0,12)},mediaKey,buf.slice(12));
    return URL.createObjectURL(new Blob([pt],{type:"audio/mpeg"}));
  })();
  blobCache.set(t.file,job); job.catch(()=>blobCache.delete(t.file));
  return job;
}
function trimCache(){
  const keep=new Set([P.i-1,P.i,P.i+1].map(j=>P.queue[j]&&P.queue[j].file).filter(Boolean));
  for(const [f,job] of blobCache){ if(!keep.has(f)){ blobCache.delete(f); job.then(u=>{ if(u!==au.src) URL.revokeObjectURL(u); }).catch(()=>{}); } }
}
// iPhones only let a page start audio during a tap. Starting a silent clip right away keeps
// the player allowed to play once the real song has loaded a moment later.
const SILENT=(()=>{ const b=new ArrayBuffer(46), v=new DataView(b), w=(o,s)=>[...s].forEach((c,i)=>v.setUint8(o+i,c.charCodeAt(0)));
  w(0,"RIFF"); v.setUint32(4,38,true); w(8,"WAVE"); w(12,"fmt "); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,8000,true); v.setUint32(28,16000,true); v.setUint16(32,2,true); v.setUint16(34,16,true); w(36,"data"); v.setUint32(40,2,true);
  return URL.createObjectURL(new Blob([b],{type:"audio/wav"})); })();
let playTok=0;
async function playAt(i){
  const t=P.queue[i]; if(!t) return;
  const my=++playTok;
  P.i=i; P.loading=true; paintPlayer(); refreshTracks(); paintTape();
  au.pause();
  try{ au.src=SILENT; au.play().catch(()=>{}); }catch(e){}   // stop the old song now + keep playback allowed
  try{
    const src=await srcFor(t);
    if(my!==playTok) return;                                  // a newer tap took over
    au.src=src; au.currentTime=0;
    await au.play();
  }catch(e){
    if(my!==playTok||(e&&e.name==="AbortError")) return;
    console.error(e); P.loading=false; paintPlayer();
    const bar=document.getElementById("player"); if(bar) bar.querySelector(".pl-sub").textContent=e&&e.name==="NotAllowedError"?"Tap play to start.":"Couldn't play this one. Check your connection.";
    return;
  }
  if(my!==playTok) return;
  P.loading=false; paintPlayer(); refreshTracks(); paintTape();
  if("mediaSession" in navigator){ try{ navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:A[t.artist].name,album:t.note||"Demo",artwork:[{src:A[t.artist].tall,sizes:"512x512",type:"image/jpeg"}]}); }catch(e){} }
  trimCache(); const nx=P.queue[P.i+1]; if(nx) srcFor(nx).catch(()=>{});
}
function setQueue(a,startIdx,shuffle){
  let q=tracksOf(a).map((t,i)=>Object.assign({artist:a,idx:i},t)).filter(t=>t.file);
  if(shuffle){ for(let j=q.length-1;j>0;j--){const r=Math.floor(Math.random()*(j+1));[q[j],q[r]]=[q[r],q[j]];} }
  P.queue=q; const at=startIdx==null?0:Math.max(0,q.findIndex(t=>t.idx===startIdx)); playAt(at);
}
function togglePlay(){ if(!curT()) return; if(au.paused){ if(!au.src||au.src===SILENT||au.error) playAt(P.i); else au.play().catch(()=>playAt(P.i)); } else au.pause(); }
const nextT=()=>{ if(P.i<P.queue.length-1) playAt(P.i+1); };
const prevT=()=>{ if(au.currentTime>3) au.currentTime=0; else if(P.i>0) playAt(P.i-1); };
function paintPlayer(){
  const bar=document.getElementById("player"), t=curT(); if(!bar) return;
  document.body.classList.toggle("playing",!!t); bar.hidden=!t; if(!t) return;
  const pt=bar.querySelector("#pl-tape"); if(pt.dataset.a!==t.artist){ pt.dataset.a=t.artist; pt.innerHTML=cassette(false,"","",t.artist); }
  bar.querySelector(".pl-t").textContent=t.title;
  bar.querySelector(".pl-sub").textContent=P.loading?"Loading…":`${A[t.artist].name} · ${t.note||"Demo"}`;
  bar.querySelector("#pl-play").innerHTML=au.paused?PLAY:PAUSE;
  bar.querySelector("#pl-play").setAttribute("aria-label",au.paused?"Play":"Pause");
}
function paintTime(){
  const bar=document.getElementById("player"); if(!bar||bar.hidden) return;
  const d=au.duration||(curT()||{}).dur||0, c=au.currentTime||0;
  const r=bar.querySelector("#pl-seek"); if(!r.matches(":active")){ r.max=d||1; r.value=c; }
  r.style.setProperty("--p",(d?c/d*100:0)+"%");
  bar.querySelector(".pl-time").textContent=`${fmtT(c)} / ${fmtT(d)}`;
  paintTape();
}
function refreshTracks(){ document.querySelectorAll("[data-play]").forEach(b=>{ const [a,i]=b.dataset.play.split(":"); const t=tracksOf(a)[+i]; const on=t&&isCur(t); b.classList.toggle("on",!!on); b.querySelector(".tp").innerHTML=on&&!au.paused?PAUSE:PLAY; }); }
au.addEventListener("play",()=>{paintPlayer();refreshTracks();paintTape()}); au.addEventListener("pause",()=>{paintPlayer();refreshTracks();paintTape()});
au.addEventListener("timeupdate",paintTime); au.addEventListener("loadedmetadata",paintTime);
au.addEventListener("ended",()=>{ if(au.src===SILENT) return; if(P.i<P.queue.length-1) playAt(P.i+1); else { paintPlayer(); refreshTracks(); } });
if("mediaSession" in navigator){ try{ navigator.mediaSession.setActionHandler("nexttrack",nextT); navigator.mediaSession.setActionHandler("previoustrack",prevT); navigator.mediaSession.setActionHandler("play",()=>au.play()); navigator.mediaSession.setActionHandler("pause",()=>au.pause()); }catch(e){} }
(function(){

  bar.querySelector("#pl-play").onclick=togglePlay; bar.querySelector("#pl-next").onclick=nextT; bar.querySelector("#pl-prev").onclick=prevT;

// ---- In-app PDF viewer (plain PDF links don't open reliably on iPhone) ----
const PDFJS="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>rej(new Error("load "+src));document.head.appendChild(s)})}
let pdfReady=null, pdfDoc=null, zoom=1, pdfToken=0;
function ensurePdf(){ if(!pdfReady){ pdfReady=loadScript(PDFJS+"pdf.min.js").then(()=>{ window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS+"pdf.worker.min.js"; }); pdfReady.catch(()=>{pdfReady=null}); } return pdfReady; }
const pv=document.getElementById("pdfv"), pages=document.getElementById("pdfpages");
async function renderPdf(){
  const tok=++pdfToken; pages.innerHTML="";
  const w=Math.min(pages.clientWidth-24, 1000)*zoom, dpr=Math.min(window.devicePixelRatio||1,3);
  for(let i=1;i<=pdfDoc.numPages;i++){
    const page=await pdfDoc.getPage(i); if(tok!==pdfToken) return;
    const base=page.getViewport({scale:1}), vp=page.getViewport({scale:(w*dpr)/base.width});
    const c=document.createElement("canvas"); c.width=Math.floor(vp.width); c.height=Math.floor(vp.height);
    c.style.width=w+"px"; c.style.height=(w*base.height/base.width)+"px"; c.setAttribute("aria-label","Page "+i);
    pages.appendChild(c);
    await page.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;
  }
}
async function openPdf(file,title){
  document.getElementById("pdft").textContent=title||"PDF";
  pv.hidden=false; document.body.style.overflow="hidden"; zoom=1;
  pages.innerHTML='<div class="pdfmsg">Opening…</div>';
  try{
    await ensurePdf();
    const buf=await (await fetch(file)).arrayBuffer();
    pdfDoc=await window.pdfjsLib.getDocument({data:buf}).promise;
    await renderPdf();
  }catch(e){ pages.innerHTML='<div class="pdfmsg">This PDF didn\'t load. Check your connection and try again.</div>'; console.error(e); }
}
function closePdf(){ pv.hidden=true; document.body.style.overflow=""; pdfToken++; pages.innerHTML=""; pdfDoc=null; }
document.getElementById("pdfclose").onclick=closePdf;
document.getElementById("zi").onclick=()=>{ if(pdfDoc&&zoom<3){zoom+=.5;renderPdf()} };

<script>
// Hosted-site stand-in for the claude.ai runtime: guest lists, travel and screenshots
// go to the Google Apps Script backend (Code.gs) instead of the artifact database.
window.makeHostedClaude=function(api){
  const call=async body=>{
    const r=await fetch(api.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({token:api.token},body))});
    const j=await r.json();
    if(!j.ok){ const e=new Error(j.error||"failed"); e.code=j.error||"failed"; throw e; }
    return j;
  };
  const subs=new Set();
  const tableOf=p=>{ if(p==="travel") return {table:"Travel"}; if(p==="guests") return {table:"Guests"}; const m=p.match(/^guests\/([a-z]+)-(\d{4}-\d{2}-\d{2})\/entries$/); if(m) return {table:"Guests",artist:m[1],date:m[2]}; throw new Error("bad path "+p); };
  const refresh=path=>subs.forEach(s=>{ if(s.path===path) s.pull(); });
  const norm=r=>{ const o=Object.assign({},r); if("plus" in o) o.plus=Number(o.plus)||0; return o; };
  const db={collection(path){ const t=tableOf(path); return {
    onSnapshot(ok,err){
      const s={path,pull:async()=>{ try{ const j=await call({action:"list",table:t.table,date:t.date,artist:t.artist}); ok({docs:j.rows.map(r=>({id:r.id,data:()=>norm(r)}))}); }catch(e){ err&&err(e); } }};
      subs.add(s); s.pull();
      const iv=setInterval(()=>{ if(!document.hidden) s.pull(); },30000);
      return ()=>{ subs.delete(s); clearInterval(iv); };
    },
    async add(row){ const j=await call({action:"add",table:t.table,row:Object.assign({},row,{date:row.date||t.date||"",artist:row.artist||t.artist||""})}); refresh(path); return {id:j.id}; },
    doc(id){ return {
      async update(p){ await call({action:"update",table:t.table,id,patch:p}); refresh(path); },
      async delete(){ await call({action:"remove",table:t.table,id}); refresh(path); }
    }; }
  }; }};
  const dev=()=>{ try{ let n=localStorage.getItem("hy-dev"); if(!n){ n="d_"+Math.random().toString(36).slice(2,10); localStorage.setItem("hy-dev",n); } return n; }catch(e){ return "d_anon"; } };
  const user={id:async()=>dev(),canEdit:()=>true};
  const b64=blob=>new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(String(fr.result).split(",")[1]); fr.onerror=rej; fr.readAsDataURL(blob); });
  const sample=Object.assign(async()=>{ throw {code:"unavailable"}; },{
    limits:async()=>({images:{maxCount:1}}),
    json:async(prompt,o)=>{ const img=o&&o.images&&o.images[0]; if(!img) throw {code:"invalid_request"};
      try{ const j=await call({action:"read",prompt,data:await b64(img),type:img.type||"image/jpeg"}); return j.value; }
      catch(e){ throw {code:e.code||"failed"}; } }
  });
  const assets={upload:async blob=>{ const j=await call({action:"upload",data:await b64(blob),type:blob.type||"image/jpeg"}); return {id:j.id,url:j.url}; }};
  const caps={db,user,sample,assets};
  return {use:async n=>caps[n]||null};
};

(function(){
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const B=window.TOURBLOB, enc=new TextEncoder();
  const base=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(B.s),iterations:B.n,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(B.i)},key,b64(B.c));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function go(pw,remember){
  try{ window.TOUR=await unlock(pw); }catch(e){ return false; }
  if(remember){ try{localStorage.setItem("hy-pw",pw)}catch(e){} }
  if(window.TOUR.api && window.makeHostedClaude) window.claude=window.makeHostedClaude(window.TOUR.api);
  document.getElementById("lock").remove(); window.startApp(); return true;
}
document.getElementById("lockf").addEventListener("submit",async e=>{e.preventDefault();
  const ok=await go(document.getElementById("pw").value,true); if(!ok){document.getElementById("lockerr").hidden=false;}});
let saved=null; try{saved=localStorage.getItem("hy-pw")}catch(e){}
(async()=>{ if(!(saved && await go(saved,false))){ try{localStorage.removeItem("hy-pw")}catch(e){} document.getElementById("pw").focus(); } })();
if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
})();
</script>
